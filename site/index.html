<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Doing solid research, from first idea to results: a handbook for people new to research, with every piece of advice traced to its source. Also in Chinese.">
<title>Research Handbook</title>
<style>
/* Layout: a quiet documentation desk. Outline on a tinted rail at left, the page on white paper in the middle, its sections at right; evidence opens as a slip beside the text */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --ink: #12161d;
  --text: #2a303a;
  --muted: #59606b;
  --faint: #8b919b;
  --line: #e6e6e1;
  --accent: #1f4a8c;
  --accent-soft: #f2f6fc;
  --accent-line: #d5e0f0;
  --analysis: #b0311e;
  --analysis-bg: #fcefec;
  --mark: #fdeba6;
  --shadow: 0 12px 32px rgba(20, 28, 45, .12);
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-latin: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
  --side: 268px;
}
/* Palettes under review: a = neutral ink/blue, b = teal, c = warm paper. Pick one, delete the others. */
:root[data-palette="a"] { --bg: #f9fafb; --surface: #ffffff; --ink: #111827; --text: #1f2937; --muted: #5b6472; --faint: #8b93a0; --line: #e5e7eb; --accent: #2457c5; --accent-soft: #f4f7fe; --accent-line: #d6e1f7; }
:root[data-palette="b"] { --bg: #f7f9f8; --surface: #ffffff; --ink: #111816; --text: #24302c; --muted: #56635e; --faint: #8a9692; --line: #e3e8e6; --accent: #0f6b5b; --accent-soft: #f1f7f5; --accent-line: #cfe3dc; }
:root[data-palette="c"] { --bg: #f6f3ee; --surface: #fffefb; --ink: #1c1917; --text: #33302c; --muted: #67615a; --faint: #9a938a; --line: #e8e2d8; --accent: #9a3b1b; --accent-soft: #fbf5ef; --accent-line: #ecd9cb; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181d; --surface: #1b1f25; --ink: #eceef2; --text: #cfd3da; --muted: #9aa1ab; --faint: #6f7680; --line: #2b3038;
    --accent: #a7c0ee; --accent-soft: #1f2838; --accent-line: #2d3d58; --analysis: #f2907b; --analysis-bg: #3a211c;
    --mark: #5a4c18; --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181d; --surface: #1b1f25; --ink: #eceef2; --text: #cfd3da; --muted: #9aa1ab; --faint: #6f7680; --line: #2b3038;
  --accent: #a7c0ee; --accent-soft: #1f2838; --accent-line: #2d3d58; --analysis: #f2907b; --analysis-bg: #3a211c;
  --mark: #5a4c18; --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
}
:root[lang="en"] { --font-body: var(--font-latin); }
:root[lang="en"] .doc { letter-spacing: 0; line-height: 1.65; }
:root[lang="en"] .doc h1, :root[lang="en"] .doc h2 { letter-spacing: -.015em; }
* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--surface); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); height: 100%; }

/* ---- sidebar ---- */
.side { border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
.brand { display: grid; gap: 2px; padding: 22px 22px 16px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand b { font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: .78rem; }
.searchbox { padding: 0 16px 10px; }
.searchbox input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: .86rem; }
.searchbox input::placeholder { color: var(--faint); }
.nav { overflow-y: auto; padding: 4px 12px 40px; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.part { margin: 20px 10px 6px; font-size: .72rem; letter-spacing: .06em; color: var(--faint); font-weight: 600; text-transform: uppercase; }
.group { margin-top: 2px; }
.group > button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 6px; font-size: .9rem; font-weight: 600; color: var(--ink); line-height: 1.45; }
.group > button:hover { background: var(--accent-soft); }
.group > button::after { content: ""; flex: none; width: 5px; height: 5px; margin: 0 2px 3px 0; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(45deg); transition: transform .15s; }
.group.closed > button::after { transform: rotate(-45deg); margin-bottom: 0; }
.group > button .count { margin-left: auto; color: var(--faint); font-size: .74rem; font-weight: 400; font-variant-numeric: tabular-nums; }
.group > button > span:first-child { flex: 1; }
.group > button > span:first-child + .count { flex: none; }
.group.closed > ul { display: none; }
.nav ul { list-style: none; margin: 2px 0 10px 16px; padding: 0; border-left: 1px solid var(--line); }
.nav li a { display: block; margin-left: -1px; padding: 4px 12px; border-left: 2px solid transparent; border-radius: 0 6px 6px 0; color: var(--muted); font-size: .875rem; line-height: 1.5; }
.nav li a:hover { color: var(--ink); background: var(--surface); text-decoration: none; }
.nav li a.on { color: var(--accent); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.nav li ul { display: none; margin: 2px 0 4px 14px; }
.nav li.open > ul { display: block; }
.nav li ul a { font-size: .82rem; }
.results { padding: 0 12px 24px; overflow-y: auto; flex: 1; }
.results a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--ink); }
.results a:hover { background: var(--surface); text-decoration: none; }
.results b { display: block; font-size: .88rem; font-weight: 600; }
.results small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.55; }
.results mark { background: var(--mark); color: inherit; }
.results p { color: var(--muted); font-size: .84rem; padding: 4px 12px; }

/* ---- main ---- */
.main { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.topbar { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; align-items: center; gap: 12px; }
.topbar button { all: unset; cursor: pointer; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: .85rem; color: var(--ink); }
.topbar b { color: var(--ink); font-weight: 700; }
.wrap { display: grid; grid-template-columns: minmax(0, 46rem) 200px; gap: 44px; justify-content: center; padding-inline: 40px 28px; padding-block: 40px 96px; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 14px; color: var(--accent); font-size: .82rem; font-weight: 600; }
.ver { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.ver small { color: var(--faint); font-size: .78rem; }
.ver-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.ver-seg button { all: unset; cursor: pointer; padding: 3px 12px; border-radius: 6px; color: var(--muted); font-size: .8rem; line-height: 1.6; }
.ver-seg button:hover { color: var(--ink); }
.ver-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.ver-seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.brandrow .brand { padding-bottom: 10px; }
.langs { margin: 0 0 14px 22px; }
.langs button { padding: 2px 9px; font-size: .74rem; }
.toc { position: sticky; top: 40px; align-self: start; font-size: .8rem; max-height: calc(100vh - 96px); overflow-y: auto; }
.toc p { color: var(--faint); font-size: .72rem; letter-spacing: .08em; font-weight: 500; margin: 0 0 10px; }
.toc a { display: block; color: var(--muted); padding: 4px 0 4px 12px; border-left: 1px solid var(--line); line-height: 1.5; }
.toc a:hover { color: var(--ink); text-decoration: none; }
.toc a.on { color: var(--accent); border-left: 2px solid var(--accent); padding-left: 11px; }

/* ---- article ---- */
.doc { min-width: 0; font-size: 16.5px; line-height: 1.78; letter-spacing: .005em; color: var(--text); }
.doc h1, .doc h2, .doc h3, .doc h4 { color: var(--ink); line-height: 1.4; letter-spacing: 0; text-wrap: balance; scroll-margin-top: 24px; font-weight: 700; }
.doc h1 { font-size: 1.95rem; line-height: 1.25; margin: 0 0 .8em; }
.doc h2 { font-size: 1.4rem; line-height: 1.35; margin: 2.1em 0 .6em; }
.doc h3 { font-size: 1.14rem; margin: 1.7em 0 .5em; font-weight: 650; }
.doc h4 { font-size: 1.02rem; margin: 1.4em 0 .4em; font-weight: 650; }
.doc p { margin: 0 0 .95em; }
.doc a:not(sup a) { text-decoration: underline; text-decoration-color: var(--accent-line); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.doc a:not(sup a):hover { text-decoration-color: currentColor; }
.doc strong { color: var(--ink); font-weight: 600; }
.doc ul, .doc ol { padding-left: 1.4em; margin: 0 0 1em; }
.doc li { margin: .3em 0; padding-left: .2em; }
.doc li::marker { color: var(--faint); font-variant-numeric: tabular-nums; }
.doc blockquote { margin: 1.2em 0; padding: 2px 0 2px 18px; border-left: 3px solid var(--line); color: var(--muted); font-size: .94em; }
.doc blockquote p { margin: .45em 0; }
.doc blockquote.mustdo { margin: 1.4em 0 1.8em; padding: 14px 20px 12px; border: 1px solid var(--accent-line); border-radius: 12px; background: var(--accent-soft); color: var(--text); font-size: .95em; line-height: 1.75; }
.doc blockquote.mustdo > p:first-child { margin: 0 0 .6em; }
.doc blockquote.mustdo > p:first-child strong { color: var(--accent); font-size: .82rem; letter-spacing: .05em; text-transform: uppercase; }
.doc blockquote.mustdo ol { margin: 0 0 .4em; padding-left: 1.3em; }
.doc blockquote.mustdo li { margin: .35em 0; }
.doc blockquote.mustdo li strong { font-weight: 600; }
:root[lang="zh-CN"] .doc blockquote.mustdo > p:first-child strong { font-size: .92rem; letter-spacing: .04em; }
.doc blockquote.mustdo > p:last-child { margin: .8em 0 0; padding-top: .7em; border-top: 1px solid var(--accent-line); }
.doc blockquote.mustdo > p:last-child strong { color: var(--accent); }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 1.8em 0; }
.doc code { font-family: var(--font-mono); font-size: .85em; background: var(--bg); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; }
.doc pre { overflow-x: auto; background: var(--bg); border: 1px solid var(--line); padding: 14px 16px; border-radius: 8px; font-size: .85rem; line-height: 1.6; letter-spacing: 0; }
.doc pre code { background: none; border: 0; padding: 0; }
.tablewrap { overflow-x: auto; margin: 1.4em 0; border: 1px solid var(--line); border-radius: 10px; }
.doc table { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.65; letter-spacing: 0; }
.doc th, .doc td { border-bottom: 1px solid var(--line); padding: 10px 14px; text-align: left; vertical-align: top; min-width: 7em; }
.doc th { background: var(--bg); color: var(--ink); font-weight: 600; }
.doc tr:last-child td { border-bottom: 0; }
.doc mark { background: var(--mark); color: inherit; border-radius: 2px; }
.doc a.dead { color: var(--muted); text-decoration: underline dotted; cursor: help; }
sup.fn { line-height: 0; }
sup.fn a { font-size: .7em; font-weight: 600; padding: 0 2px; border-radius: 3px; }
sup.fn a:hover { background: var(--accent-soft); text-decoration: none; }
.fnlist { margin-top: 2.4em; padding-top: 1.2em; border-top: 1px solid var(--line); font-size: .82rem; line-height: 1.7; letter-spacing: 0; color: var(--muted); }
.fnlist summary { display: flex; align-items: center; gap: 10px; width: fit-content; cursor: pointer; list-style: none; padding: 4px 0; color: var(--ink); font-size: .92rem; font-weight: 600; }
.fnlist summary::-webkit-details-marker { display: none; }
.fnlist summary::before { content: ""; flex: none; width: 5px; height: 5px; margin: 0 2px 2px 2px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(-45deg); transition: transform .15s; }
.fnlist[open] summary::before { transform: rotate(45deg); margin-bottom: 4px; }
.fnlist summary span { color: var(--faint); font-size: .78rem; font-weight: 400; }
.fnlist summary:hover { color: var(--accent); }
.fnlist ol { padding-left: 2.4em; margin: 10px 0 0; }
.fnlist li { max-width: none; margin: .3em 0; }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 44px; flex-wrap: wrap; }
.pager a { flex: 1 1 14rem; border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; background: var(--surface); color: var(--ink); font-weight: 500; }
.pager a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.pager small { display: block; color: var(--faint); font-size: .75rem; font-weight: 400; }
.pager a.next { text-align: right; }
.loading { color: var(--muted); padding: 40px 0; }

/* ---- evidence slip ---- */
.slip { position: fixed; z-index: 20; width: min(30rem, calc(100vw - 32px)); max-height: min(60vh, 32rem); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 18px; font-size: .88rem; line-height: 1.65; }
.slip header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
.slip header span { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.slip header button { all: unset; cursor: pointer; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 2px 6px; }
.slip .def { margin: 0 0 8px; }
.slip .quote { border-left: 3px solid var(--analysis); background: var(--analysis-bg); padding: 8px 12px; border-radius: 0 6px 6px 0; }
.slip .quote ul { margin: 0; padding-left: 1.1em; }
.slip .quote p { margin: .3em 0; }
.slip .more { display: inline-block; margin-top: 8px; font-size: .8rem; }

@media (max-width: 1180px) { .wrap { grid-template-columns: minmax(0, 46rem); } .toc { display: none; } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: none; visibility: hidden; padding-top: env(safe-area-inset-top, 0px); }
  .side.open { transform: none; box-shadow: var(--shadow); visibility: visible; }
  .topbar { display: flex; }
  .wrap { padding-inline: 20px; padding-block: 28px 72px; }
  .doc { font-size: 16.5px; }
  :root[lang="en"] .doc { line-height: 1.66; }
  .doc h1 { font-size: 1.7rem; }
  .doc h2 { font-size: 1.32rem; }
  .doc blockquote.mustdo { padding: 16px 18px 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brandrow"><a class="brand" href="#README"><b>Research Handbook</b><span id="tagline"></span></a>
      <span class="ver-seg langs" role="group" aria-label="Language / 语言"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="zh" lang="zh-CN">中文</button></span></div>
    <div class="searchbox"><input id="q" type="search" autocomplete="off"></div>
    <nav class="nav" id="nav"></nav>
    <div class="results" id="results" hidden></div>
  </aside>
  <main class="main" id="main">
    <div class="topbar"><button id="menu" type="button"></button><b>Research Handbook</b></div>
    <div class="wrap">
      <article class="doc" id="doc"><p class="loading">Loading…</p></article>
      <aside class="toc" id="toc"></aside>
    </div>
  </main>
</div>
<div class="slip" id="slip" hidden></div>

      var m = g.part, long = !m && g.items.length > 8;
      if (m && !mainShown) { html += '<p class="part">' + esc(T.parts) + "</p>"; mainShown = true; }
      if (!m && mainShown && !refShown) { html += '<p class="part">' + esc(T.ref) + "</p>"; refShown = true; }
      var saved = store("rh-nav-" + g.label), closed = saved ? saved === "1" : long;
      html += '<div class="group' + (closed ? " closed" : "") + '" data-label="' + esc(g.label) + '"><button type="button" aria-expanded="' + !closed + '">' +
        "<span>" + esc(m || g.label) + "</span>" +
        (long ? '<span class="count">' + esc(T.pages(g.items.length)) + "</span>" : "") + "</button><ul>";
      g.items.forEach(function (it) {
        order.push(it.path);
        var kids = it.children && it.children.length;
        html += "<li" + (kids ? ' class="parent"' : "") + '><a href="#' + tokenOf(it.path) + '" data-p="' + it.path + '">' +
'<span class="t">' + esc(it.label) + "</span></a>";
        if (kids) {
          html += "<ul>";
          it.children.forEach(function (c) { order.push(c.path); html += '<li><a href="#' + tokenOf(c.path) + '" data-p="' + c.path + '"><span class="t">' + esc(c.label) + "</span></a></li>"; });
          html += "</ul>";
        }
        html += "</li>";
      });
      html += "</ul></div>";
    });
    navEl.innerHTML = html;
    navEl.querySelectorAll(".group > button").forEach(function (b) {
      b.addEventListener("click", function () {
        var g = b.parentNode, closed = g.classList.toggle("closed");
        b.setAttribute("aria-expanded", !closed);
        store("rh-nav-" + g.dataset.label, closed ? "1" : "0");
      });
    });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function labelOf(path) { var a = navEl.querySelector('a[data-p="' + path + '"] .t'); return a ? a.textContent : (DATA.pages[path] || {}).title || path; }
  function groupOf(path) { var a = navEl.querySelector('a[data-p="' + path + '"]'); var g = a && a.closest(".group"); return g ? g.dataset.label : ""; }

  // ---- markdown ----
  function prepare(md) {
    fnDefs = {};
    var lines = md.split("\n"), body = [];
    lines.forEach(function (l) {
      var m = /^\[\^([^\]]+)\]:\s?(.*)$/.exec(l);
      if (m) fnDefs[m[1]] = m[2]; else body.push(l);
    });
    var n = 0, num = {};
    var text = body.join("\n").replace(/\[\^([^\]\s]+)\]/g, function (all, id) {
      if (!(id in fnDefs)) return all;
      if (!(id in num)) num[id] = ++n;
      return '<sup class="fn"><a href="#" data-fn="' + esc(id) + '">' + num[id] + "</a></sup>";
    });
    var list = Object.keys(num).sort(function (a, b) { return num[a] - num[b]; });
    return { text: text, list: list, num: num };
  }

  function resolveLink(href, base) {
    if (/^(https?:|mailto:)/.test(href)) return { ext: href };
    if (href.charAt(0) === "#") return { anchor: decodeURIComponent(href.slice(1)) };
    var i = href.indexOf("#"), p = i < 0 ? href : href.slice(0, i), a = i < 0 ? "" : decodeURIComponent(href.slice(i + 1));
    var full = join(dirname(base), decodeURI(p));
    if (/\/$/.test(p) || !/\.md$/.test(full)) {
      var asReadme = full.replace(/\/$/, "") + "/README.md";
      if (DATA.pages[asReadme]) full = asReadme;
    }
    if (DATA.pages[full]) return { page: full, anchor: a };
    var m = /^sources\/notes\/([^\/]+)\.md$/.exec(full);
    if (m) return { note: m[1], anchor: a };
    return { dead: full };
  }

  function wireLinks(root, base) {
    root.querySelectorAll("a[href]").forEach(function (a) {
      if (a.closest("sup.fn, .pager")) return;
      var r = resolveLink(a.getAttribute("href"), base);
      if (r.ext) { a.target = "_blank"; a.rel = "noopener"; }
      else if (r.page) { a.href = "#" + tokenOf(r.page); a.dataset.anchor = r.anchor || ""; }
      else if (r.note) { a.href = "#"; a.dataset.note = r.note; a.dataset.anchor = r.anchor || ""; }
      else if (r.anchor !== undefined) { a.href = "#"; a.dataset.local = r.anchor; }
      else { a.removeAttribute("href"); a.className = "dead"; a.title = T.dead + r.dead; }
    });
  }

  function decorate(root) {
    var slug = slugger();
    root.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(function (h) { h.id = slug(h.textContent); });
    root.querySelectorAll("blockquote").forEach(function (b) { var s = b.querySelector("p > strong:first-child"); if (s && /^(这一章必须做的事|What you must do in this chapter)/.test(s.textContent)) b.className = "mustdo"; });
    root.querySelectorAll("table").forEach(function (t) {
      var w = document.createElement("div"); w.className = "tablewrap"; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
  }

  function mdOf(path) { return MODE === "short" && SHORT[path] ? SHORT[path] : DATA.pages[path].md; }
  function setMode(m, rerender) {
    MODE = m; store("rh-mode", m); plain = {};
    if (rerender && current) show(current); if (qEl.value.trim()) search();
  }

  // ---- render a page ----
  function show(path, anchor, highlight) {
    var pg = DATA.pages[path];
    if (!pg) { path = "README.md"; pg = DATA.pages[path]; }
    current = path; closeSlip();
    var prep = prepare(mdOf(path));
    var html = marked.parse(prep.text);
    if (prep.list.length) {
      html += '<details class="fnlist"><summary>' + esc(T.notes) + "<span>" + esc(T.items(prep.list.length)) + "</span></summary><ol>" + prep.list.map(function (id) {
        return '<li><a href="#" data-fnref="' + esc(id) + '" title="' + esc(T.openBeside) + '">↗</a> ' + marked.parseInline(fnDefs[id]) + "</li>";
      }).join("") + "</ol></details>";
    }
    var idx = order.indexOf(path), prev = idx > 0 ? order[idx - 1] : null, next = idx >= 0 && idx < order.length - 1 ? order[idx + 1] : null;
    html += '<nav class="pager">' + (prev ? '<a class="prev" href="#' + tokenOf(prev) + '"><small>' + esc(T.prev) + "</small>" + esc(labelOf(prev)) + "</a>" : "<span></span>") +
      (next ? '<a class="next" href="#' + tokenOf(next) + '"><small>' + esc(T.next) + "</small>" + esc(labelOf(next)) + "</a>" : "") + "</nav>";
    var g = path !== "README.md" ? groupOf(path) : "", ver = "";
    if (SHORT[path]) ver = '<div class="ver"><small>' + esc(MODE === "short" ? T.shortHint : T.fullHint) + '</small><span class="ver-seg" role="group" aria-label="' + esc(T.version) + '">' +
      '<button type="button" data-mode="short" aria-pressed="' + (MODE === "short") + '">' + esc(T.short) + '</button><button type="button" data-mode="full" aria-pressed="' + (MODE === "full") + '">' + esc(T.full) + "</button></span></div>";
    docEl.innerHTML = (g || ver ? '<div class="crumb"><span>' + esc(g) + "</span>" + ver + "</div>" : "") + html;
    decorate(docEl);
    wireLinks(docEl, path);
    buildToc();
    navEl.querySelectorAll("a.on").forEach(function (a) { a.classList.remove("on"); });
    navEl.querySelectorAll("li.open").forEach(function (l) { l.classList.remove("open"); });
    var on = navEl.querySelector('a[data-p="' + path + '"]');
    if (on) {
      on.classList.add("on");
      var par = on.closest("li.parent"); if (par) par.classList.add("open");
      var grp = on.closest(".group"); if (grp) { grp.classList.remove("closed"); grp.querySelector("button").setAttribute("aria-expanded", "true"); }
      on.scrollIntoView({ block: "nearest" });
    }
    document.title = (pg.title ? pg.title + " · " : "") + "Research Handbook";
    store("rh-last", path);
    $("side").classList.remove("open");
    if (highlight) { var hit = markText(docEl, highlight); if (hit) { hit.scrollIntoView({ block: "center" }); return; } }
    if (anchor) scrollToAnchor(anchor); else mainEl.scrollTop = 0;
  }

  function scrollToAnchor(a) {
    var el = document.getElementById(a) || document.getElementById(a.toLowerCase());
    if (el) el.scrollIntoView({ block: "start" });
  }

  function buildToc() {
    var hs = docEl.querySelectorAll(".doc > h2");
    if (hs.length < 2) { tocEl.innerHTML = ""; return; }
    tocEl.innerHTML = "<p>" + esc(T.onPage) + "</p>" + Array.prototype.map.call(hs, function (h) {
      return '<a href="#" data-local="' + esc(h.id) + '">' + esc(h.textContent) + "</a>";
    }).join("");
  }
  mainEl.addEventListener("scroll", function () {
    var links = tocEl.querySelectorAll("a"); if (!links.length) return;
    var hs = docEl.querySelectorAll(".doc > h2"), cur = null;
    hs.forEach(function (h) { if (h.getBoundingClientRect().top < 120) cur = h.id; });
    links.forEach(function (l) { l.classList.toggle("on", l.dataset.local === cur); });
  }, { passive: true });

  function markText(root, q) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), node, low = q.toLowerCase();
    while ((node = walker.nextNode())) {
      var i = node.nodeValue.toLowerCase().indexOf(low);
      if (i >= 0 && !node.parentNode.closest(".pager,.fnlist")) {
        var r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + q.length);
        var m = document.createElement("mark"); r.surroundContents(m); return m;
      }
    }
    return null;
  }

  // ---- evidence slip ----
  function loadNotes() {
    if (NOTES) return Promise.resolve(NOTES);
    if (!notesLoading) notesLoading = fetch(LANG + "/notes.json").then(function (r) { return r.json(); }).then(function (j) { NOTES = j; return j; });
    return notesLoading;
  }
  function entryOf(key, anchor) {
    var md = NOTES[key]; if (!md) return null;
    var head = (/^# (.+)$/m.exec(md) || [])[1] || key;
    if (!anchor) return { head: head, body: md };
    var re = new RegExp("^#{2,4} " + anchor.toUpperCase() + "\\s*$", "m"), m = re.exec(md);
    if (!m) return { head: head, body: "" };
    var rest = md.slice(m.index + m[0].length), end = rest.search(/^#{2,4} /m);
    return { head: head, body: (end < 0 ? rest : rest.slice(0, end)).trim() };
  }
  function openSlip(at, defMd, key, anchor) {
    slip.innerHTML = '<header><span>' + esc(key ? key + (anchor ? " · " + anchor.toUpperCase() : "") : T.note) + '</span><button type="button" aria-label="' + esc(T.close) + '">×</button></header>' +
      (defMd ? '<p class="def">' + marked.parseInline(defMd) + "</p>" : "") + (key ? '<div class="quote">' + esc(T.loadingQuote) + "</div>" : "");
    slip.querySelector("header button").onclick = closeSlip;
    slip.querySelectorAll(".def a[href]").forEach(function (a) {
      var r = resolveLink(a.getAttribute("href"), current);
      if (r.ext) { a.target = "_blank"; a.rel = "noopener"; } else a.removeAttribute("href");
    });
    slip.hidden = false; place(at);
    if (key) loadNotes().then(function () {
      var e = entryOf(key, anchor), q = slip.querySelector(".quote");
      if (!q) return;
      if (!e || !e.body) { q.textContent = T.noEntry; return; }
      q.innerHTML = '<div style="font-size:.78rem;color:var(--muted);margin-bottom:4px">' + esc(e.head) + "</div>" + marked.parse(e.body.length > 4000 ? e.body.slice(0, 4000) + "\n\n……" : e.body);
      place(at);
    }).catch(function () { var q = slip.querySelector(".quote"); if (q) q.textContent = T.notesFail; });
  }
  function place(at) {
    var r = at.getBoundingClientRect(), w = slip.offsetWidth, h = slip.offsetHeight, vw = innerWidth, vh = innerHeight;
    var left = Math.min(Math.max(16, r.left - w / 2), vw - w - 16), top = r.bottom + 8;
    if (top + h > vh - 16) top = Math.max(16, r.top - h - 8);
    slip.style.left = left + "px"; slip.style.top = top + "px";
  }
  function closeSlip() { slip.hidden = true; }
  function evidenceOf(def) {
    var m = /\]\(([^)\s]*sources\/notes\/[^)\s]+)\)/.exec(def || "");
    if (!m) return null;
    var r = resolveLink(m[1], current);
    return r.note ? r : null;
  }

  // ---- clicks ----
  document.addEventListener("click", function (e) {
    var lb = e.target.closest("[data-lang]");
    if (lb) { if (lb.dataset.lang !== LANG) setLang(lb.dataset.lang); return; }
    var mb = e.target.closest("[data-mode]");
    if (mb) { if (mb.dataset.mode !== MODE) setMode(mb.dataset.mode, true); return; }
    var a = e.target.closest("a");
    if (!a) { if (!slip.hidden && !e.target.closest(".slip")) closeSlip(); return; }
    if (a.dataset.fn || a.dataset.fnref) {
      e.preventDefault();
      var id = a.dataset.fn || a.dataset.fnref, def = fnDefs[id], ev = evidenceOf(def);
      openSlip(a, def, ev && ev.note, ev && ev.anchor);
      return;
    }
    if (a.dataset.note !== undefined && a.dataset.note) { e.preventDefault(); openSlip(a, "", a.dataset.note, a.dataset.anchor); return; }
    if (a.dataset.local !== undefined) { e.preventDefault(); scrollToAnchor(a.dataset.local); return; }
    var href = a.getAttribute("href") || "";
    if (href.charAt(0) === "#" && href.length > 1 && !a.closest(".slip")) {
      e.preventDefault();
      var path = pathOf(href.slice(1));
      if (location.hash !== href) { pendingAnchor = a.dataset.anchor || ""; location.hash = href; }
      else show(path, a.dataset.anchor || "");
    }
  });
  var pendingAnchor = "", pendingHighlight = "";
  window.addEventListener("hashchange", function () {
    show(pathOf(location.hash.slice(1)), pendingAnchor, pendingHighlight);
    pendingAnchor = ""; pendingHighlight = "";
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSlip(); });
  mainEl.addEventListener("scroll", function () { if (!slip.hidden) closeSlip(); }, { passive: true });
  $("menu").addEventListener("click", function () { $("side").classList.toggle("open"); });

  // ---- search ----
  var plain = {};
  function plainOf(p) {
    if (!plain[p]) plain[p] = mdOf(p).replace(/^\[\^[^\]]+\]:.*$/gm, "").replace(/\[\^[^\]]+\]/g, "").replace(/\]\([^)]*\)/g, "]").replace(/[#>*`|\[\]]/g, " ").replace(/\s+/g, " ");
    return plain[p];
  }
  var qEl = $("q"), timer = null;
  qEl.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(search, 150); });
  function search() {
    var q = qEl.value.trim();
    if (!q) { resEl.hidden = true; navEl.hidden = false; return; }
    var low = q.toLowerCase(), hits = [];
    order.concat(Object.keys(DATA.pages).filter(function (p) { return order.indexOf(p) < 0; })).forEach(function (p) {
      var t = plainOf(p), lt = t.toLowerCase(), i = lt.indexOf(low);
      if (i < 0) return;
      var count = lt.split(low).length - 1, inTitle = (DATA.pages[p].title || "").toLowerCase().indexOf(low) >= 0;
      var s = Math.max(0, i - 30), snip = t.slice(s, i + q.length + 50);
      hits.push({ p: p, score: (inTitle ? 1000 : 0) + count, snip: (s > 0 ? "…" : "") + snip + "…" });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    navEl.hidden = true; resEl.hidden = false;
    if (!hits.length) { resEl.innerHTML = "<p>" + esc(T.none(q)) + "</p>"; return; }
    var reQ = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    resEl.innerHTML = "<p>" + esc(T.found(hits.length)) + "</p>" + hits.slice(0, 60).map(function (h) {
      return '<a href="#' + tokenOf(h.p) + '" data-hl="1"><b>' + esc(labelOf(h.p)) + "</b><small>" + esc(h.snip).replace(reQ, function (m) { return "<mark>" + m + "</mark>"; }) + "</small></a>";
    }).join("");
  }
  resEl.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-hl]"); if (!a) return;
    e.preventDefault(); e.stopPropagation();
    var href = a.getAttribute("href"), q = qEl.value.trim();
    if (location.hash !== href) { pendingHighlight = q; location.hash = href; } else show(pathOf(href.slice(1)), "", q);
  }, true);

  // ---- language ----
  function applyChrome() {
    document.documentElement.lang = T.html;
    $("tagline").textContent = T.tagline; qEl.placeholder = T.search; $("menu").textContent = T.menu;
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === LANG); });
  }
  function load() {
    applyChrome();
    docEl.innerHTML = '<p class="loading">' + esc(T.loading) + "</p>";
    return Promise.all([fetch(LANG + "/guide.json").then(function (r) { return r.json(); }), fetch(LANG + "/guide-short.json").then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })]).then(function (res) {
      DATA = res[0]; SHORT = res[1]; order = []; buildNav();
      setMode(store("rh-mode") === "full" ? "full" : "short", false);
    });
  }
  function setLang(l) {
    LANG = l; T = I18N[l]; store("rh-lang", l);
    NOTES = null; notesLoading = null; plain = {}; closeSlip();
    var keep = current;
    load().then(function () { show(keep || "README.md"); if (qEl.value.trim()) search(); })
      .catch(function () { docEl.innerHTML = '<p class="loading">' + esc(T.fail) + "</p>"; });
  }

  // ---- boot ----
  load().then(function () {
    var start = location.hash.length > 1 ? pathOf(location.hash.slice(1)) : (store("rh-last") || "README.md");
    show(start);
  }).catch(function () { docEl.innerHTML = '<p class="loading">' + esc(T.fail) + "</p>"; });
})();
</script>
</body>
</html>
