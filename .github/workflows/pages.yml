# Builds the web reader (site/index.html + JSON bundles) and publishes it to GitHub Pages.
# Full version comes from main, the concise version from the concise branch.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: full
      - uses: actions/checkout@v4
        with:
          ref: concise
          path: short
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python full/scripts/build_site.py --full full --short short --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
